# Hyperparameter configuration for Moss Mother boss fight

# Scenario
boss: MossMother

# Training configuration
total_timesteps: 100000
time_scale: 8.0
no_fx: true
seed: 123  # null means random seed

# Handicap system
handicaps:
  has_clawline: false
  has_cling_grip: false
  has_dash: false
  has_double_jump: false
  has_drifters_cloak: false
  has_needle_strike: false
  has_silkspear: false
  max_health: 5
  max_silk: 9
  needle_upgrades: 0
  silk_hearts: 0

# PPO hyperparameters
learning_rate: 0.0009654400943128438
n_steps: 2048
batch_size: 512
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.03388623559819072
vf_coef: 0.4424364893339975
max_grad_norm: 0.3

# Network architecture
features_dim: 256
pi_layers: [128]
vf_layers: [128]

# Reward configuration
boss_damage_coef: 1.0
boss_defeat_coef: 0.0
player_damage_coef: 0.1
too_far_coef: 0.001
too_far_threshold: 15.0
too_close_coef: 0.001
too_close_threshold: 1.0
time_penalty_coef: 0.0001
silk_coef: 0.0