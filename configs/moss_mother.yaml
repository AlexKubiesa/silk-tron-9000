# Hyperparameter configuration for Moss Mother boss fight

# Scenario
boss: MossMother

# Training configuration
total_timesteps: 300000
time_scale: 8.0
no_fx: true
seed: 123 # null means random seed
n_envs: 4 # each game instance uses ~2 GB RAM

# Handicap system
handicaps:
  has_clawline: false
  has_cling_grip: false
  has_dash: false
  has_double_jump: false
  has_drifters_cloak: false
  has_needle_strike: false
  has_silkspear: false
  hunter_crest_version: 1
  max_health: 5
  max_silk: 9
  needle_upgrades: 0
  silk_hearts: 0

# PPO hyperparameters
learning_rate: 0.0007969454818643932
n_steps: 512 # per env; rollout size is n_steps * n_envs
batch_size: 512
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.03388623559819072
vf_coef: 0.4424364893339975
max_grad_norm: 0.3

# Network architecture
features_dim: 256
pi_layers: [128]
vf_layers: [128]

# Reward configuration
boss_damage_coef: 1.0
boss_defeat_coef: 0.0
player_damage_coef: 0.1
too_far_coef: 0.001
too_far_threshold: 15.0
too_close_coef: 0.001
too_close_threshold: 1.0
time_penalty_coef: 0.0001
silk_coef: 0.0

tuning:
  search_space:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true
    n_steps:
      type: categorical
      choices: [512, 1024, 2048, 4096, 8192]
    batch_size:
      type: categorical
      choices: [64, 128, 256, 512]
    n_epochs:
      type: int
      low: 3
      high: 10
    gamma:
      type: float
      low: 0.95
      high: 0.999
    gae_lambda:
      type: float
      low: 0.9
      high: 0.99
    clip_range:
      type: float
      low: 0.1
      high: 0.3
    ent_coef:
      type: float
      low: 0.001
      high: 0.1
      log: true
    vf_coef:
      type: float
      low: 0.3
      high: 0.7
    max_grad_norm:
      type: float
      low: 0.3
      high: 1.0
    features_dim:
      type: categorical
      choices: [128, 256]
    pi_layers:
      type: categorical
      choices: [[128], [256]]
    vf_layers:
      type: categorical
      choices: [[128], [256]]
