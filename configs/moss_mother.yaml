# Hyperparameter configuration for Moss Mother boss fight

# Scenario
boss: MossMother

# Training configuration
total_timesteps: 100000
time_scale: 4.0
no_fx: true
seed: 123  # null means random seed

# PPO hyperparameters
learning_rate: 5.0e-4
n_steps: 2048
batch_size: 512
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.03
vf_coef: 0.5
max_grad_norm: 0.3

# Network architecture
features_dim: 256
pi_layers: [128]
vf_layers: [128]

# Reward configuration
boss_damage_coef: 1.0
player_damage_coef: 0.1
too_far_coef: 0.001
too_far_threshold: 15.0
too_close_coef: 0.001
too_close_threshold: 1.0
time_penalty_coef: 0.0001
silk_coef: 0.0